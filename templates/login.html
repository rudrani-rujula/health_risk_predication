<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | Health Risk Analyzer</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #eef3f8, #d4e0ed); min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; color: #1a365d; }
        .auth-card { width: min(420px, 100%); background: white; padding: 34px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
        h1 { margin: 0 0 8px; text-align: center; } p { color: #718096; text-align: center; }
        label { display: block; margin: 18px 0 6px; font-weight: 600; color: #2d3748; }
        input { width: 100%; box-sizing: border-box; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #1a365d; color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
        .link { margin-top: 20px; } a { color: #2563a6; font-weight: 600; }
        .message { padding: 10px; border-radius: 6px; background: #ebf8ff; color: #2c5282; }
    </style>
</head>
<body>
    <main class="auth-card">
        <h1>Health Risk Analyzer</h1>
        <p>Log in to securely save your assessments.</p>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}
        {% endwith %}
        <form method="post">
            <label for="username">Username</label>
            <input id="username" name="username" required autocomplete="username">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
            <button type="submit">Log in</button>
        </form>
        <p class="link">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
    </main>
</body>
</html>
